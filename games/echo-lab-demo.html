<script>
(() => {
  if (!matchMedia("(pointer: coarse)").matches) return;

  // 1. 音の単位
  const asked = Number(new URLSearchParams(location.search).get("buffer"));
  const BIG = [2048, 4096, 8192, 16384].includes(asked) ? asked : 4096;
  const Context = window.AudioContext || window.webkitAudioContext;
  if (Context) {
    const create = Context.prototype.createScriptProcessor;
    Context.prototype.createScriptProcessor = function (size, inputs, outputs) {
      if (!size || BIG <= size || BIG % size) return create.call(this, size, inputs, outputs);
      const node = create.call(this, BIG, inputs, outputs);
      let fill = null;  // Pyxel（SDL）が、size 個の箱を埋めるために置く関数
      Object.defineProperty(node, "onaudioprocess", { get: () => fill, set: (fn) => { fill = fn; } });
      node.addEventListener("audioprocess", (e) => {
        if (!fill) return;
        const out = e.outputBuffer;
        const data = [];
        for (let c = 0; c < out.numberOfChannels; c++) data.push(out.getChannelData(c));
        for (let at = 0; at < BIG; at += size) {
          fill({ outputBuffer: { numberOfChannels: out.numberOfChannels,
                                 getChannelData: (c) => data[c].subarray(at, at + size) } });
        }
      });
      return node;
    };
  }

  // 2. 全画面（ブラウザは、画面に触れた直後しか全画面にさせてくれない）。
  //    自分で全画面を抜けた人には、もう全画面にしない（ページを読み込み直せば、また全画面になる）
  let auto = true;
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) auto = false; });
  const fullscreen = () => {
    const root = document.documentElement;
    if (!auto || document.fullscreenElement || !root.requestFullscreen) return;
    root.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
  };
  document.addEventListener("touchend", fullscreen);
  document.addEventListener("click", fullscreen);

  // 3. ボタンの文字

    ["pyxel-gamepad-button", 0.495, 0.781, "Z", "JUMP", "#70c6a9"],
    ["pyxel-gamepad-button", 0.781, 0.495, "X", "LOOP", "#7696de"],
    ["pyxel-gamepad-button", 0.209, 0.495, "C", "UNDO", "#e9c35b"],
    ["pyxel-gamepad-button", 0.495, 0.209, "R", "RESET", "#d38441"],
    ["pyxel-gamepad-menu", 0.745, 0.48, "P", "MENU", "#7696de"],
    ["pyxel-gamepad-menu", 0.245, 0.48, "P", "MENU", "#7696de"],
  ];
  const style = document.createElement("style");
  style.textContent = ".echo-lab-label{position:fixed;transform:translate(-50%,-50%);color:#a9c1ff;"
    + "font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:bold;text-align:center;line-height:1.1;"
    + "white-space:nowrap;pointer-events:none;user-select:none;-webkit-user-select:none;z-index:10}"
    + ".echo-lab-label b{display:block;font-size:1.7em}";
  document.head.appendChild(style);
  let labels = null;
  const place = () => {
    const images = LABELS.map(([id]) => document.getElementById(id));
    if (images.some((img) => !img)) return;  // ボタンは、スマホで画面に触れて始めたときにできる
    if (!labels) {
      labels = LABELS.map(([id, , , key, action, color]) => {
        const el = document.createElement("div");
        el.className = "echo-lab-label";
        const head = '<span style="color:' + color + '">' + key + "</span>";
        el.innerHTML = id.endsWith("menu") ? head + " " + action : "<b>" + head + "</b>" + action;
        document.body.appendChild(el);
        return el;
      });
    }
    LABELS.forEach(([id, fx, fy], i) => {
      const r = images[i].getBoundingClientRect();
      const el = labels[i];
      el.style.display = r.width ? "" : "none";
      el.style.left = r.left + r.width * fx + "px";
      el.style.top = r.top + r.height * fy + "px";
      el.style.fontSize = (id.endsWith("menu") ? r.height * 0.28 : r.width * 0.06) + "px";
    });
  };

  window.addEventListener("resize", place);
